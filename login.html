<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-left">
        <div class="heading">Get Started Now</div>
        <div class="form">
          <div class="form-email">
            <div class="form-label">Email</div>
            <input id="email" type="email" placeholder="Enter your email" />
          </div>
          <div class="form-password">
            <div class="password-label">
              <div class="form-label">Password</div>
              <a href="#forgot-password">Forgot password</a>
            </div>
            <input id="password" type="password" placeholder="Password" />
          </div>
          <div class="form-remember">
            <input type="checkbox" id="terms" />
            <label for="terms">Remember me for 30 days</label>
          </div>
          <div class="form-button">
            <button id="signin-button">Sign In</button>
          </div>
          <div id="form-help" class="form-help">
            Nhập sai thông tin!
        </div>
        </div>
        <div class="form-or">
          <div class="form-or-line"></div>
          <div class="form-or-text">Or</div>
          <div class="form-or-line"></div>
        </div>
        <div class="form-social">
          <div class="form-icons">
            <div class="form-icon">
              <div>
                <img src="images/google.svg" alt="Multicolored Google logo" />
              </div>
              <div class="form-or-text">Sign in with Google</div>
            </div>
            <div class="form-icon">
              <div>
                <img src="images/apple.svg" alt="" />
              </div>
              <div class="form-or-text">Sign in with Apple</div>
            </div>
          </div>
          <div class="form-signin">
            <div>Don’t have an account? <a href="index.html">Sign Up</a></div>
          </div>
        </div>
      </div>
      <div class="auth-right">
        <img src="images/images_auth.png" alt="Logo" />
      </div>
    </div>
    <script src="signin.js"></script>
   </body>
</html>
